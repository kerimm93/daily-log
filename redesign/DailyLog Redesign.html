<!DOCTYPE html>
<html lang="de" data-theme="dark" data-dir="journal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyLog Redesign · Hi-Fi Prototyp</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #root { height: 100%; }
    textarea:focus { border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-bg) !important; }
    input[type="checkbox"] { width: 14px; height: 14px; }
    button { transition: background .12s, color .12s, border-color .12s, transform .07s; }
    button:active { transform: translateY(1px) !important; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 4px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-track { background: transparent; }
    [data-dir="ledger"] .section,
    [data-dir="ledger"] .card {
      border: none !important;
      border-top: 1.5px solid var(--border-mid) !important;
      border-radius: 0 !important;
      background: transparent !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>

  <script type="text/babel" src="dl-shared.jsx"></script>
  <script type="text/babel" src="dl-screens.jsx"></script>
  <script type="text/babel" src="dl-app.jsx"></script>
</body>
</html>
